<button
  data-drawer-target="default-sidebar"
  data-drawer-toggle="default-sidebar"
  aria-controls="default-sidebar"
  type="button"
  (click)="toggleMenu()"
  class="inline-flex items-center p-2 mt-2 ms-3 text-sm rounded-lg sm:hidden text-gray-400 hover:text-black dark:hover:bg-accent-300"
>
  <span class="sr-only">Open sidebar</span>
  <svg
    class="w-6 h-6"
    aria-hidden="true"
    fill="currentColor"
    viewBox="0 0 20 20"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      clip-rule="evenodd"
      fill-rule="evenodd"
      d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"
    ></path>
  </svg>
</button>

<aside
  id="default-sidebar"
  class="fixed top-0 md:static z-40 w-64 h-screen transition-transform"
  aria-label="Sidebar"
  [ngClass]="{ '-translate-x-full': !isMenuOpen, 'sm:translate-x-0': true }"
>
  <div class="h-full flex flex-col">
    <!-- Header con logo -->
    <div class="px-6 py-5 border-b border-accent-100 bg-accent-100">
      <div class="flex justify-center items-center gap-3">
        <h1 class="text-2xl font-extrabold tracking-tight text-primary-titulo">
          PRACTICA
        </h1>
      </div>
    </div>

    <!-- Usuario -->
    <div class="px-6 py-4 bg-white shadow-inner border-b border-accent-100">
      <div class="flex items-center gap-4">
        <div class="relative">
          <div
            class="w-12 h-12 rounded-full bg-accent-200 border-2 border-accent-300 flex items-center justify-center"
          >
            <svg
              class="h-6 w-6 text-neutral-800"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </div>
          <span
            class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"
          ></span>
        </div>
        <div class="">
          <p class="font-semibold text-neutral-800 w-44 text-sm mr-3">
            {{ userEmail }}
          </p>
          <span
            class="text-xs px-2 py-1 rounded-full bg-accent-200 text-warning-700 font-semibold"
            >{{ rolName }}</span
          >
        </div>
      </div>
    </div>

    <!-- Menú -->
    <nav class="flex-1 px-4 py-4 overflow-y-auto bg-white">
      <ul class="space-y-1">
        <ng-container *ngFor="let item of menuItems">
          <!-- Item sin subitems -->
          <li *ngIf="!item.subItems">
            <a
              [routerLink]="item.link"
              class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 group"
              [ngClass]="{
                'bg-primary-400/10 text-primary-titulo font-semibold':
                  activeLink === item.name,
                'text-neutral-700 hover:bg-accent-100': activeLink !== item.name
              }"
            >
              <i
                [class]="
                  item.icon +
                  ' w-5 text-lg group-hover:text-primary-500 transition-colors'
                "
              ></i>
              <span class="truncate">{{ item.name }}</span>
            </a>
          </li>

          <!-- Item con subitems -->
          <li *ngIf="item.subItems">
            <div
              (click)="item.isOpen = !item.isOpen"
              class="flex items-center px-4 py-3 rounded-xl cursor-pointer transition-all duration-200"
              [ngClass]="{
                'bg-accent-100 text-neutral-800 font-semibold': item.isOpen,
                'text-neutral-700 hover:bg-accent-100': !item.isOpen
              }"
            >
              <i [class]="item.icon + ' w-5 mr-3'"></i>
              <span class="flex-1">{{ item.name }}</span>
              <i
                class="fas fa-chevron-down text-xs transition-transform"
                [class.rotate-180]="item.isOpen"
              ></i>
            </div>

            <ul *ngIf="item.isOpen" class="ml-8 mt-1 space-y-1">
              <li *ngFor="let subItem of item.subItems">
                <a
                  [routerLink]="subItem.link"
                  class="flex items-center px-3 py-2 text-sm rounded-lg transition-colors"
                  [ngClass]="{
                    'text-primary-titulo font-medium bg-accent-100':
                      activeLink === subItem.name,
                    'text-neutral-600 hover:bg-accent-100/50':
                      activeLink !== subItem.name
                  }"
                >
                  <span
                    class="w-2 h-2 rounded-full bg-current mr-3 opacity-50"
                  ></span>
                  {{ subItem.name }}
                </a>
              </li>
            </ul>
          </li>
        </ng-container>
      </ul>
    </nav>

    <!-- Botón cerrar sesión -->
    <div class="px-4 py-4 border-t border-accent-200 bg-white">
      <a
        (click)="logout()"
        class="flex items-center gap-3 px-4 py-3 rounded-lg bg-warning-600 text-white hover:bg-warning-700 transition-colors cursor-pointer"
      >
        <i class="fas fa-sign-out-alt w-5"></i>
        <span class="font-medium">Cerrar sesión</span>
      </a>
    </div>
  </div>
</aside>

<!-- Overlay para móviles -->
<div
  *ngIf="isMenuOpen"
  class="sm:hidden fixed inset-0 z-20 bg-black/40 backdrop-blur-sm"
  (click)="toggleMenu()"
></div>
