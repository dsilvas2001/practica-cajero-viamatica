<div
  class="min-h-screen bg-gradient-to-br from-secondary-50 to-accent-100 flex items-center justify-center p-4"
>
  <div class="w-full max-w-md">
    <!-- Notificación -->
    <app-notifications
      *ngIf="statusnotification"
      [statusnotification]="statusnotification"
      [title]="notificationTitle"
      [message]="notificationMessage"
      [type]="notificationType"
      (close)="statusnotification = false"
    ></app-notifications>

    <!-- Card con efecto de vidrio -->
    <div
      class="bg-secondary-50/80 backdrop-blur-lg rounded-2xl shadow-xl overflow-hidden border border-primary-400/20"
    >
      <!-- Barra decorativa animada -->
      <div
        class="h-2 bg-gradient-to-r from-primary-400 to-warning-600 bg-[length:200%_200%] animate-[gradient_3s_ease_infinite]"
      ></div>

      <div class="p-8">
        <!-- Logo y título -->
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 bg-primary-500 rounded-xl flex items-center justify-center mx-auto shadow-lg mb-4"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-8 w-8 text-white"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              />
            </svg>
          </div>
          <h1 class="text-3xl font-bold text-neutral-800">
            Recupera tu acceso
          </h1>
          <p class="text-neutral-700 mt-2">
            Ingresa tu correo y te enviaremos un enlace para restablecer tu
            contraseña
          </p>
        </div>

        <!-- Formulario -->
        <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-neutral-800 mb-1"
              >Correo electrónico</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5 text-neutral-700"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  />
                </svg>
              </div>
              <input
                id="email"
                type="email"
                formControlName="email"
                class="block w-full pl-10 pr-3 py-3 rounded-lg border border-neutral-700/30 focus:ring-2 focus:ring-primary-400 focus:border-primary-400 bg-white/70 transition duration-200"
                placeholder="tucorreo@ejemplo.com"
                [ngClass]="{
                  'border-red-500':
                    authForm.get('email')?.invalid &&
                    authForm.get('email')?.touched
                }"
              />
            </div>
            <div
              *ngIf="
                authForm.get('email')?.invalid && authForm.get('email')?.touched
              "
              class="text-red-500 text-sm mt-1"
            >
              <span *ngIf="authForm.get('email')?.errors?.['required']"
                >Email requerido</span
              >
              <span *ngIf="authForm.get('email')?.errors?.['email']"
                >Ingresa un email válido</span
              >
            </div>
          </div>

          <button
            type="submit"
            [disabled]="isLoading || authForm.invalid"
            class="w-full flex justify-center items-center py-3 px-4 rounded-lg bg-gradient-to-r from-primary-400 to-warning-600 text-white font-medium shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-400 focus:ring-offset-2 disabled:opacity-70 disabled:cursor-not-allowed"
          >
            <span *ngIf="!isLoading">Enviar enlace</span>
            <span *ngIf="isLoading">
              <i class="fas fa-circle-notch fa-spin mr-2"></i> Enviando...
            </span>
          </button>
        </form>

        <div class="mt-6 text-center">
          <button
            routerLink="/Auth/sign-in"
            class="text-primary-titulo hover:text-warning-700 font-medium text-sm flex items-center justify-center space-x-1"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            <span>Volver al inicio de sesión</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Efectos de burbujas con Tailwind -->
    <div
      class="fixed -bottom-32 -left-40 w-80 h-80 bg-accent-200 rounded-full filter blur-3xl opacity-30 animate-[blob_7s_infinite]"
    ></div>
    <div
      class="fixed -top-20 -right-20 w-96 h-96 bg-primary-400 rounded-full filter blur-3xl opacity-20 animate-[blob_7s_infinite] animate-[animation-delay:2s]"
    ></div>
  </div>
</div>
