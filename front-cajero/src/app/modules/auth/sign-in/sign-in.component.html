<div class="min-h-screen flex flex-col md:flex-row bg-secondary-50">
  <!-- Sección izquierda - Formulario mejorado -->
  <div class="w-full md:w-1/2 flex justify-center flex-col">
    <div class="flex justify-center md:justify-start pt-12 md:pl-12 md:-mb-24">
      <!-- Barra decorativa con sombra -->
      <div
        class="h-1.5 bg-gradient-to-r from-primary-400 via-accent-300 to-warning-600 rounded-full shadow-md"
      ></div>
    </div>

    <div class="p-8 md:p-10">
      <!-- Logo y título -->
      <div class="text-center mb-8">
        <div
          class="w-20 h-20 bg-gradient-to-br from-primary-400 to-warning-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg mb-6"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-10 w-10 text-white"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
        </div>
        <h1
          class="font-poppins font-bold text-3xl md:text-4xl text-neutral-800"
        >
          ¡Bienvenido!
        </h1>
        <p class="font-poppins mt-3 text-neutral-700 text-lg">
          Ingresa tus credenciales para continuar
        </p>
      </div>

      <!-- Formulario -->
      <form class="space-y-6" [formGroup]="authForm" (ngSubmit)="onSubmit()">
        <!-- Campo Email con icono coloreado -->
        <div class="space-y-2">
          <label for="email" class="block font-medium text-neutral-800">
            Correo electrónico
          </label>
          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-neutral-700"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                />
              </svg>
            </div>
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="tucorreo@ejemplo.com"
              class="block w-full pl-10 pr-3 py-3 rounded-lg border border-neutral-700/30 focus:ring-2 focus:ring-primary-400 focus:border-primary-400 bg-white/70 transition duration-200"
              placeholder="tucorreo@ejemplo.com"
              [class.border-red-300]="
                authForm.get('email')?.invalid && authForm.get('email')?.touched
              "
            />
          </div>
          <div
            *ngIf="
              authForm.get('email')?.hasError('required') &&
              authForm.get('email')?.touched
            "
            class="text-red-500 text-sm"
          >
            El email es obligatorio
          </div>
          <div
            *ngIf="
              authForm.get('email')?.hasError('email') &&
              authForm.get('email')?.touched
            "
            class="text-red-500 text-sm"
          >
            Ingresa un email válido
          </div>
        </div>

        <!-- Campo Contraseña con icono coloreado -->
        <div class="space-y-2">
          <label for="password" class="block font-medium text-neutral-800">
            Contraseña
          </label>
          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-neutral-700"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                />
              </svg>
            </div>
            <input
              type="password"
              id="password"
              formControlName="password"
              placeholder="••••••••"
              class="block w-full pl-12 pr-4 py-3 rounded-xl border border-neutral-300 focus:ring-2 focus:ring-primary-400 focus:border-transparent bg-white/70 transition duration-200"
              [class.border-red-300]="
                authForm.get('password')?.invalid &&
                authForm.get('password')?.touched
              "
            />
          </div>
          <div
            *ngIf="
              authForm.get('password')?.hasError('required') &&
              authForm.get('password')?.touched
            "
            class="text-red-500 text-sm"
          >
            La contraseña es obligatoria
          </div>
        </div>

        <!-- Botón de envío -->
        <button
          type="submit"
          [disabled]="authForm.invalid"
          class="w-full py-3 px-6 rounded-xl bg-gradient-to-r from-primary-400 to-warning-600 text-white font-bold shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-primary-400 focus:ring-offset-2 disabled:opacity-70 disabled:cursor-not-allowed"
        >
          <span *ngIf="!isLoading">Iniciar sesión</span>
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <svg
              class="animate-spin -ml-1 mr-2 h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            Procesando...
          </span>
        </button>
      </form>

      <!-- Enlace de recuperación -->
      <div class="text-center pt-8">
        <p class="text-neutral-700">
          ¿Olvidaste tu contraseña?
          <a
            routerLink="/Auth/forgot-password"
            class="text-warning-700 font-semibold hover:text-warning-800 hover:underline transition duration-200"
          >
            Recupérala aquí
          </a>
        </p>
      </div>
    </div>
  </div>

  <!-- Sección derecha - Imagen -->
  <div class="hidden md:block md:w-1/2 relative overflow-hidden">
    <div
      class="absolute inset-0 bg-gradient-to-t from-neutral-900/70 to-transparent z-10"
    ></div>
    <img
      class="w-full h-full object-cover object-center"
      src="https://img.freepik.com/free-photo/accountant-office_1098-13392.jpg"
      alt="Imagen de fondo"
    />
    <div class="absolute bottom-8 left-8 right-8 z-20 text-white">
      <h2 class="text-3xl font-bold mb-2">
        Descubre todo lo que tenemos para ti
      </h2>
      <p class="text-lg opacity-90">
        Accede a tu cuenta para gestionar tus proyectos y documentos de manera
        eficiente.
      </p>
    </div>
  </div>
</div>

<app-notifications
  [statusnotification]="statusnotification"
  [title]="notificationTitle"
  [message]="notificationMessage"
  [type]="notificationType"
></app-notifications>
