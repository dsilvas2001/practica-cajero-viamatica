<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm"
>
  <div
    class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 overflow-hidden"
  >
    <!-- Header con degradado -->
    <div class="bg-gradient-to-r from-primary-400 to-primary-500 px-6 py-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fas fa-user-edit text-neutral-100"></i>
          Editar Usuario: {{ usuario?.username }}
        </h2>
        <button
          (click)="onClose()"
          class="text-neutral-100 hover:text-white transition-colors"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Contenido del formulario -->
    <form [formGroup]="userForm" class="p-6 space-y-5">
      <!-- Username -->
      <div>
        <label class="block text-sm font-medium text-neutral-700 mb-1">
          Username
        </label>
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
          >
            <i class="fas fa-user text-neutral-400"></i>
          </div>
          <input
            formControlName="username"
            type="text"
            class="pl-10 pr-4 py-2 w-full border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-400 focus:border-primary-400"
            [ngClass]="{
              'border-red-500':
                userForm.get('username')?.invalid &&
                userForm.get('username')?.touched
            }"
          />
        </div>
        <div
          *ngIf="
            userForm.get('username')?.invalid &&
            userForm.get('username')?.touched
          "
          class="text-sm text-red-600 mt-1"
        >
          <i class="fas fa-exclamation-circle mr-1"></i> Campo requerido
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-neutral-700 mb-1">
          Email
        </label>
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
          >
            <i class="fas fa-envelope text-neutral-400"></i>
          </div>
          <input
            formControlName="email"
            type="email"
            class="pl-10 pr-4 py-2 w-full border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-400 focus:border-primary-400"
            [ngClass]="{
              'border-red-500':
                userForm.get('email')?.invalid && userForm.get('email')?.touched
            }"
          />
        </div>
        <div
          *ngIf="
            userForm.get('email')?.invalid && userForm.get('email')?.touched
          "
          class="text-sm text-red-600 mt-1"
        >
          <i class="fas fa-exclamation-circle mr-1"></i>
          <span *ngIf="userForm.get('email')?.errors?.['required']"
            >Campo requerido</span
          >
          <span *ngIf="userForm.get('email')?.errors?.['email']"
            >Email inválido</span
          >
        </div>
      </div>

      <!-- Rol (no editable) -->
      <div>
        <label class="block text-sm font-medium text-neutral-700 mb-1">
          Rol
        </label>
        <div
          class="inline-flex items-center px-3 py-1.5 rounded-full"
          [ngClass]="{
            'bg-purple-100 text-purple-800':
              usuario?.rol?.rolName === 'Administrador',
            'bg-blue-100 text-blue-800': usuario?.rol?.rolName === 'Gestor',
            'bg-amber-100 text-amber-800': usuario?.rol?.rolName === 'Cajero'
          }"
        >
          <i class="fas fa-user-tag mr-2 text-neutral-700"></i>
          {{ usuario?.rol?.rolName || "No asignado" }}
        </div>
        <p class="text-xs text-neutral-500 mt-1">
          El rol no puede ser modificado
        </p>
      </div>

      <!-- Estado -->
      <div>
        <label class="block text-sm font-medium text-neutral-700 mb-1">
          Estado
        </label>
        <div class="relative">
          <select
            formControlName="estado"
            class="appearance-none pl-3 pr-10 py-2 w-full border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-400 focus:border-primary-400"
          >
            <option *ngFor="let estado of estados" [value]="estado.id">
              {{ estado.name }}
            </option>
          </select>
          <div
            class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none"
          >
            <i class="fas fa-chevron-down text-neutral-400"></i>
          </div>
        </div>
      </div>

      <!-- Aprobación -->
      <!-- <div class="flex items-center justify-between pt-2">
        <span class="text-sm font-medium text-neutral-700">
          Usuario aprobado
        </span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input
            type="checkbox"
            formControlName="aprobado"
            class="sr-only peer"
          />
          <div
            class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-primary-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"
          ></div>
        </label>
      </div> -->
    </form>

    <!-- Footer -->
    <div
      class="bg-neutral-50 px-6 py-4 flex justify-end gap-3 border-t border-neutral-200"
    >
      <button
        (click)="onClose()"
        class="px-5 py-2 text-sm font-medium text-neutral-700 bg-white border border-neutral-300 rounded-lg hover:bg-neutral-50 focus:outline-none focus:ring-2 focus:ring-primary-400"
      >
        Cancelar
      </button>
      <button
        (click)="guardarCambios()"
        [disabled]="userForm.invalid || isLoading"
        class="px-5 py-2 text-sm font-medium text-white bg-primary-500 rounded-lg hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-primary-400 disabled:opacity-70 disabled:cursor-not-allowed"
      >
        <span *ngIf="!isLoading">Guardar cambios</span>
        <span *ngIf="isLoading">
          <i class="fas fa-circle-notch fa-spin mr-2"></i> Guardando...
        </span>
      </button>
    </div>
  </div>
</div>
<app-notifications
  [statusnotification]="statusnotification"
  [title]="notificationTitle"
  [message]="notificationMessage"
  [type]="notificationType"
></app-notifications>
