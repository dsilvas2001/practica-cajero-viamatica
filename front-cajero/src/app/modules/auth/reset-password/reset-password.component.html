<div
  class="min-h-screen bg-gradient-to-br from-secondary-50 to-accent-100 flex items-center justify-center p-4"
>
  <div class="w-full max-w-md">
    <!-- Notificación -->
    <app-notifications
      *ngIf="statusnotification"
      [statusnotification]="statusnotification"
      [title]="notificationTitle"
      [message]="notificationMessage"
      [type]="notificationType"
      (close)="statusnotification = false"
    ></app-notifications>

    <!-- Card con efecto de vidrio -->
    <div
      class="bg-secondary-50/80 backdrop-blur-lg rounded-2xl shadow-xl overflow-hidden border border-primary-400/20"
    >
      <!-- Barra decorativa animada -->
      <div
        class="h-2 bg-gradient-to-r from-primary-400 to-warning-600 bg-[length:200%_200%] animate-[gradient_3s_ease_infinite]"
      ></div>

      <div class="p-8">
        <!-- Logo y título -->
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 bg-primary-500 rounded-xl flex items-center justify-center mx-auto shadow-lg mb-4"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-8 w-8 text-white"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              />
            </svg>
          </div>
          <h1 class="text-3xl font-bold text-neutral-800">Nueva Contraseña</h1>
          <p class="text-neutral-700 mt-2">
            Ingresa y confirma tu nueva contraseña
          </p>
        </div>

        <!-- Formulario -->
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <!-- Nueva Contraseña -->
          <div>
            <label
              for="newPassword"
              class="block text-sm font-medium text-neutral-800 mb-1"
              >Nueva Contraseña</label
            >
            <div class="relative">
              <input
                id="newPassword"
                type="password"
                formControlName="newPassword"
                class="block w-full pl-3 pr-3 py-3 rounded-lg border focus:ring-2 focus:ring-primary-400 focus:border-primary-400 bg-white/70 transition duration-200"
                [ngClass]="{
                  'border-green-500': getFieldStatus('newPassword') === 'valid',
                  'border-red-500': getFieldStatus('newPassword') === 'invalid',
                  'border-neutral-700/30':
                    getFieldStatus('newPassword') === 'neutral'
                }"
                placeholder="Mínimo 8 caracteres, 1 mayúscula y 1 número"
              />
            </div>
            <div
              *ngIf="
                resetForm.get('newPassword')?.invalid &&
                resetForm.get('newPassword')?.touched
              "
              class="text-red-500 text-sm mt-1"
            >
              <span *ngIf="resetForm.get('newPassword')?.errors?.['required']"
                >Campo requerido</span
              >
              <span *ngIf="resetForm.get('newPassword')?.errors?.['minlength']"
                >Mínimo 8 caracteres</span
              >
              <span
                *ngIf="resetForm.get('newPassword')?.errors?.['passwordRequirements']"
              >
                Debe contener al menos 1 mayúscula y 1 número
              </span>
            </div>
          </div>

          <!-- Confirmar Contraseña -->
          <div>
            <label
              for="confirmPassword"
              class="block text-sm font-medium text-neutral-800 mb-1"
              >Confirmar Contraseña</label
            >
            <div class="relative">
              <input
                id="confirmPassword"
                type="password"
                formControlName="confirmPassword"
                class="block w-full pl-3 pr-3 py-3 rounded-lg border focus:ring-2 focus:ring-primary-400 focus:border-primary-400 bg-white/70 transition duration-200"
                [ngClass]="{
                  'border-green-500':
                    getFieldStatus('confirmPassword') === 'valid',
                  'border-red-500':
                    getFieldStatus('confirmPassword') === 'invalid',
                  'border-neutral-700/30':
                    getFieldStatus('confirmPassword') === 'neutral'
                }"
                placeholder="Repite tu contraseña"
              />
            </div>
            <div
              *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.errors?.['mismatch']"
              class="text-red-500 text-sm mt-1"
            >
              Las contraseñas no coinciden
            </div>
          </div>

          <button
            type="submit"
            [disabled]="isLoading || resetForm.invalid"
            class="w-full flex justify-center items-center py-3 px-4 rounded-lg bg-gradient-to-r from-primary-400 to-warning-600 text-white font-medium shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-400 focus:ring-offset-2 disabled:opacity-70 disabled:cursor-not-allowed"
          >
            <span *ngIf="!isLoading">Restablecer Contraseña</span>
            <span *ngIf="isLoading">
              <i class="fas fa-circle-notch fa-spin mr-2"></i> Procesando...
            </span>
          </button>
        </form>

        <div class="mt-6 text-center">
          <button
            routerLink="/Auth/sign-in"
            class="text-primary-titulo hover:text-warning-700 font-medium text-sm flex items-center justify-center space-x-1"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            <span>Volver al inicio de sesión</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
